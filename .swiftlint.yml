disabled_rules:
  - legacy_constructor
  - operator_whitespace
  - variable_name

opt_in_rules:
  - force_unwrapping
  - trailing_whitespace
  - duplicate_imports
  - identifier_name

force_unwrapping:
  severity: warning

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 200
  error: 400

nesting:
  type_level: 1

identifier_name:
  min_length: 1
  max_length: 100

type_name:
  min_length: 1
  max_length: 100

excluded:
  - Packages/*/.build
  - Packages/**/.build
  - .build
  - .swiftpm
  - MyMovieList.xcodeproj
  - Build
  - DerivedData
